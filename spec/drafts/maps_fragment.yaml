wellcontrol_keywords:
  - '\bblowout\b'
  - '\bblow-out\b'
  - '\bblowout preventer\b'
  - '\bwell control\b'
  - '\bwell-control\b'
  - '\bbop\b'
  - '\bworkover\b'
  - '\bchristmas tree\b'
  - '\bh2s\b'
  - '\bhydrogen sul[fp]hide\b'
  - '\bgas migration\b'
  - '\blost circulation\b'
  - '\bsnubbing\b'
  - '\bcoiled tubing\b'
  - '\bwellhead\b'


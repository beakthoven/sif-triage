# pytest root configuration.
#
# Before this file existed, bare `pytest` walked the whole repo and tried to
# collect packaging/pendrive/staging/ — the vendored pendrive runtime trees
# (runtime-linux/-win/ python site-packages, incl. pandas/pyarrow/onnxruntime
# conftests) — which produced 11 collection errors and a bogus "3 collected".
# testpaths pins discovery to the real suite; norecursedirs keeps the
# vendored/bundled trees out even when tests are passed explicitly.
[pytest]
testpaths = tests
norecursedirs = packaging dashboard .venv .* build dist node_modules staging
python_files = test_*.py *_test.py golden_regression.py probe_process_safety.py
addopts = -ra
